name: Build unsigned Splotify IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run ios:sync

      - name: Archive (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH" || { echo "App.app missing after archive"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr splotify-unsigned.ipa Payload
          ls -la "$RUNNER_TEMP/splotify-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: splotify-unsigned-ipa
          path: ${{ runner.temp }}/splotify-unsigned.ipa
